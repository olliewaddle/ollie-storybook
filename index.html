<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ollie's World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #98FB98 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .hero {
            text-align: center;
            padding: 30px 20px 20px;
        }

        .hero-duck {
            width: 120px;
            height: 120px;
            background: #FFD700;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .hero h1 {
            font-size: 2.5em;
            color: #5c4a3d;
            text-shadow: 2px 2px 0 #fff;
        }

        .big-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .big-btn {
            aspect-ratio: 1;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .big-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .big-btn .icon {
            font-size: 4em;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
        }

        .big-btn .label {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn-stories {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
        }

        .btn-videos {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-about {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .btn-fun {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #5c4a3d;
            font-size: 0.9em;
        }

        @media (max-width: 400px) {
            .big-buttons {
                gap: 15px;
                padding: 15px;
            }
            .big-btn .icon {
                font-size: 3em;
            }
            .big-btn .label {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="hero-duck">🐤</div>
        <h1>Ollie's World</h1>
    </div>

    <div class="big-buttons">
        <a href="stories/" class="big-btn btn-stories">
            <span class="icon">📚</span>
            <span class="label">Stories</span>
        </a>

        <a href="videos/" class="big-btn btn-videos">
            <span class="icon">🎬</span>
            <span class="label">Videos</span>
        </a>

        <a href="about/" class="big-btn btn-about">
            <span class="icon">🐣</span>
            <span class="label">About Me</span>
        </a>

        <a href="fun/" class="big-btn btn-fun">
            <span class="icon">🎮</span>
            <span class="label">Fun</span>
        </a>
    </div>

    <div class="footer">
        Made with 💛 by Ollie
    </div>
</body>
</html>
