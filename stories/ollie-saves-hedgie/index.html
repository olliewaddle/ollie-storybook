<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie Saves Hedgie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #2c1810 0%, #1a0f0a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Georgia', serif;
            padding: 20px;
        }

        h1 {
            color: #f5e6d3;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .book-container {
            max-width: 900px;
            width: 100%;
        }

        .page-spread {
            margin-bottom: 30px;
            text-align: center;
        }

        .page-spread img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .cover img {
            max-width: 450px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #f5e6d3;
            text-decoration: none;
            font-size: 1rem;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .back-link:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .cover img { max-width: 100%; }
        }
    </style>
</head>
<body>
    <a href="../" class="back-link">← Back to Stories</a>
    <h1>Ollie Saves Hedgie</h1>

    <div class="book-container">
        <div class="page-spread cover">
            <img src="cover.png" alt="Cover - Ollie Saves Hedgie">
        </div>
        <div class="page-spread">
            <img src="pages-01-02.png" alt="Pages 1-2">
        </div>
        <div class="page-spread">
            <img src="pages-03-04.png" alt="Pages 3-4">
        </div>
        <div class="page-spread">

        </div>
        <div class="page-spread">

        </div>
        <div class="page-spread">
            <img src="pages-09-10.png" alt="Pages 9-10">
        </div>
        <div class="page-spread">
            <img src="pages-11-12.png" alt="Pages 11-12">
        </div>
        <div class="page-spread">
            <img src="pages-13-14.png" alt="Pages 13-14">
        </div>
        <div class="page-spread">
            <img src="pages-15-16.png" alt="Pages 15-16">
        </div>
        <div class="page-spread">

</body>
</html>
