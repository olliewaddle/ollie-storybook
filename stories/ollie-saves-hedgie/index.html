<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ollie Saves Hedgie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Full screen book display */
        .book-viewer {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* The page image - fills screen height, crops sides if needed */
        .page-display {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center center;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Big tap zones - left and right halves of screen */
        .tap-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .tap-zone:active {
            background: rgba(255,255,255,0.1);
        }

        .tap-zone.left {
            left: 0;
            justify-content: flex-start;
            padding-left: 20px;
        }

        .tap-zone.right {
            right: 0;
            justify-content: flex-end;
            padding-right: 20px;
        }

        /* Big arrow buttons that kids can see and tap */
        .arrow-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            opacity: 0.8;
            transition: transform 0.2s, opacity 0.2s;
        }

        .tap-zone:active .arrow-btn {
            transform: scale(1.1);
            opacity: 1;
        }

        .tap-zone.disabled {
            pointer-events: none;
        }

        .tap-zone.disabled .arrow-btn {
            opacity: 0.2;
        }

        /* Home button - big house icon */
        .home-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 20;
            text-decoration: none;
        }

        .home-btn:active {
            transform: translateX(-50%) scale(1.1);
        }

        /* Page dots at bottom - visual progress */
        .page-dots {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 20;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: background 0.3s, transform 0.3s;
        }

        .dot.active {
            background: rgba(255,255,255,0.9);
            transform: scale(1.3);
        }

        /* Page flip animation */
        .page-display {
            transition: opacity 0.3s, transform 0.3s;
        }

        .page-display.flipping {
            opacity: 0;
            transform: scale(0.95);
        }

        /* Mobile optimizations */
        @media (max-width: 600px) {
            .arrow-btn {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }
            .home-btn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .tap-zone.left { padding-left: 10px; }
            .tap-zone.right { padding-right: 10px; }
        }

        /* Tablet/larger screens - even bigger buttons */
        @media (min-width: 1024px) {
            .arrow-btn {
                width: 100px;
                height: 100px;
                font-size: 50px;
            }
            .home-btn {
                width: 70px;
                height: 70px;
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <!-- Home button - house icon kids recognize -->
    <a href="../" class="home-btn" aria-label="Back to stories">🏠</a>

    <div class="book-viewer">
        <img id="pageImage" class="page-display" src="cover.png" alt="Story page">
    </div>

    <!-- Left tap zone with back arrow -->
    <div id="leftZone" class="tap-zone left disabled" onclick="prevPage()">
        <div class="arrow-btn">◀</div>
    </div>

    <!-- Right tap zone with forward arrow -->
    <div id="rightZone" class="tap-zone right" onclick="nextPage()">
        <div class="arrow-btn">▶</div>
    </div>

    <!-- Page dots for visual progress -->
    <div class="page-dots" id="pageDots"></div>

    <script>
        const pages = [
            'cover.png',
            'single-pages/page-01.png',
            'single-pages/page-02.png',
            'single-pages/page-03.png',
            'single-pages/page-04.png',
            'single-pages/page-05.png',
            'single-pages/page-06.png',
            'single-pages/page-07.png',
            'single-pages/page-08.png',
            'single-pages/page-09.png',
            'single-pages/page-10.png',
            'single-pages/page-11.png',
            'single-pages/page-12.png',
            'single-pages/page-13.png',
            'single-pages/page-14.png',
            'single-pages/page-15.png',
            'single-pages/page-16.png',
            'single-pages/page-17.png',
            'single-pages/page-18.png',
            'single-pages/page-19.png',
            'single-pages/page-20.png',
            'single-pages/page-21.png',
            'single-pages/page-22.png',
            'single-pages/page-23.png',
            'single-pages/page-24.png',
            'single-pages/page-25.png',
            'single-pages/page-26.png',
            'single-pages/page-27.png',
            'single-pages/page-28.png'
        ];

        let currentPage = 0;
        const totalPages = pages.length;
        const pageImage = document.getElementById('pageImage');
        const leftZone = document.getElementById('leftZone');
        const rightZone = document.getElementById('rightZone');
        const pageDots = document.getElementById('pageDots');

        // Create page dots
        for (let i = 0; i < totalPages; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            pageDots.appendChild(dot);
        }

        function updateDots() {
            const dots = pageDots.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentPage);
            });
        }

        function updateButtons() {
            leftZone.classList.toggle('disabled', currentPage === 0);
            rightZone.classList.toggle('disabled', currentPage === totalPages - 1);
        }

        function goToPage(index) {
            if (index < 0 || index >= totalPages || index === currentPage) return;

            // Flip animation
            pageImage.classList.add('flipping');

            setTimeout(() => {
                currentPage = index;
                pageImage.src = pages[currentPage];
                updateDots();
                updateButtons();

                setTimeout(() => {
                    pageImage.classList.remove('flipping');
                }, 50);
            }, 300);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) {
                goToPage(currentPage + 1);
            }
        }

        function prevPage() {
            if (currentPage > 0) {
                goToPage(currentPage - 1);
            }
        }

        // Swipe support for touch devices
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const swipeDistance = touchStartX - touchEndX;

            if (Math.abs(swipeDistance) > 50) {
                if (swipeDistance > 0) {
                    nextPage(); // Swipe left = next
                } else {
                    prevPage(); // Swipe right = prev
                }
            }
        }, { passive: true });

        // Keyboard support (for parents helping)
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextPage();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevPage();
            }
        });

        // Preload images for smooth transitions
        pages.forEach(src => {
            const img = new Image();
            img.src = src;
        });
    </script>
</body>
</html>
